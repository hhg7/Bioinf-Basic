name             = Cn-Bioinf
author           = David E. Condon <dcondon@uidaho.edu>
license          = Perl_5
copyright_year   = 2026-present
copyright_holder = David E. Condon

; Gathered with [Git::GatherDir], as ~/Scripts/stats is, so that only tracked
; files can reach a release; [PruneFiles] below then keeps out the tracked ones
; that are not part of it (alien/, the helper scripts, the maintainer's notes).
[@Filter]
-bundle = @Basic
-remove = MakeMaker
-remove = GatherDir

; Makefile.PL and MANIFEST are the hand-kept ones compile.sh builds with; the
; release gets its own, written by [MakeMaker::Awesome] and [Manifest], and two
; files of one name in a build is an error.
[Git::GatherDir]
exclude_filename = Makefile.PL
exclude_filename = MANIFEST

[PruneFiles]
match = ^(?!lib/|t/|share/|Bioinf\.xs$|README(\.md)?$|CONTRIBUTING\.md$|SECURITY\.md$|Changes$|Makefile\.PL$|META\.(yml|json)$|LICENSE$|MANIFEST$).
; share/ ships, since share/msa_plot.py, share/hirisplex_s_panel.tsv,
; share/blood_type_panel.tsv and share/genetic_codes.tsv are installed and
; read; the generators that write the three tables are not.  Each needs the
; network and a modern perl (and the second bcftools), nothing loads them, and
; the committed .tsv beside each is what the module reads.
match = ^share/make_hirisplex_panel\.pl$
match = ^share/make_blood_type_panel\.pl$
match = ^share/make_genetic_codes\.pl$

[PodWeaver]

[MakeMaker::Awesome]
eumm_version = 6.48
header = use Config;
header = use File::Temp ();
header = use File::Spec ();
header = # Bioinf.xs needs C99: // comments, declarations after statements and in for(),
header = # and `restrict` where the compiler has a spelling for it.  The flag that asks
header = # for C99 is per-vendor, and it cannot be guessed from $Config{cc}: that is
header = # plain "cc" for Oracle Studio on Solaris and for aCC on HP-UX, both of which
header = # would fail the build on an illegal option if handed -std=gnu99.  So each
header = # candidate is trial-compiled and the first one that actually works wins:
header = # -std=gnu99/-std=c99 for gcc and clang (all BSDs included), -xc99=all for
header = # Studio, -qlanglvl=extc99 for AIX xlc, -AC99 for HP-UX, and finally '' for a
header = # compiler whose default mode is already C99.  MSVC is skipped outright -- it
header = # needs no flag for any of the above and merely warns on switches it does not
header = # know, which would make the probe pick a no-op.  This is the probe from
header = # ~/Scripts/stats/dist.ini; the x87 and long-double probes there are left out,
header = # because the only floating-point arithmetic in Bioinf.xs is one NV division
header = # for each of concordance's ratios, which calls nothing in libm.
header = my $std = '';
header = unless ($Config{cc} =~ /(?:^|[\/\\])cl(?:\.exe)?$/i) {
header =     my $c99 = "#include <stdint.h>\n"
header =             . "int main(void) { uint64_t u = 0; // C99 comment\n"
header =             . "for (int i = 0; i < 3; i++) { u += (uint64_t)i; }\n"
header =             . "return (int)(u - 3); }\n";
header =     my $dir = File::Temp::tempdir(CLEANUP => 1);
header =     my $src = File::Spec->catfile($dir, 'c99probe.c');
header =     my $obj = File::Spec->catfile($dir, 'c99probe.o');
header =     if (open my $probe_fh, '>', $src) {
header =         print {$probe_fh} $c99;
header =         close $probe_fh;
header =         my $quiet = File::Spec->devnull;
header =         for my $flag ('-std=gnu99', '-std=c99', '-xc99=all', '-qlanglvl=extc99', '-AC99', '') {
header =             # quoted, since a temporary directory can have a space in it (a Windows
header =             # user name), and every flag would then fail and none be chosen
header =             next if system("$Config{cc} $flag -c \"$src\" -o \"$obj\" > $quiet 2> $quiet") != 0;
header =             $std = $flag eq '' ? '' : " $flag";
header =             last;
header =         }
header =     }
header = }
WriteMakefile_arg = CCFLAGS => $Config::Config{ccflags} . $std

[VersionFromModule]
[MetaJSON]

; the 'provides' map in META.yml/META.json: which module each package lives in,
; and at what version.  CPANTS looks for it (meta_yml_has_provides), and PAUSE
; indexes from it rather than guessing by scanning the tarball.
[MetaProvides::Package]
meta_noindex = 1

; Everything lib/Cn/Bioinf.pm and t/ load, core modules included, so that
; the list is the whole truth rather than only the part a CPAN client has to
; fetch.  Scalar::Util's looks_like_number, which protein_charge checks its pH
; with, is as old as the module (1.01, perl 5.8.1).  Exporter 5.57 is the first whose import() can be imported, as
; `use Exporter 'import'` does; File::ShareDir 1.00 is what Makefile.PL has
; always asked for.  HTTP::Tiny 0.056 is the first with can_ssl(), which
; pdb_search asks before it reaches RCSB; it is core from perl 5.14, so a 5.12
; perl fetches it.  Alien::Bioinf is the sibling distribution in
; alien/Alien-Bioinf, which provides clustalo, BLAST+ and the Python that
; share/msa_plot.py runs under.  perl is 5.012, raised from 5.010 on
; 2026-10-21 to match Alien::Bioinf, which cannot be installed on 5.10 (see
; its Makefile.PL).  test.all.perls.pl reads the minimum from this line.
[Prereqs]
perl               = 5.012
Carp               = 0
Digest::SHA        = 0
Exporter           = 5.57
File::Path         = 0
File::ShareDir     = 1.00
File::Spec         = 0
File::Temp         = 0
FindBin            = 0
HTTP::Tiny         = 0.056
IO::Uncompress::Gunzip = 0
IO::Uncompress::Bunzip2 = 0
JSON::MaybeXS      = 0
MIME::Base64       = 0
Scalar::Util       = 0
Sys::Hostname      = 0
XSLoader           = 0

; Alien::Bioinf is recommended rather than required: it installs only where
; NCBI builds BLAST+ (Linux and macOS on x86_64 and aarch64, Windows on x86_64)
; and needs the network, so as a requirement it would stop the FASTA and BLAST
; functions, which do not use it, installing anywhere else. The module loads it
; only in the functions that run clustalo, blastp or Python, and t/msa.t skips
; without it.
;
; pdb_search reaches RCSB over HTTPS, which HTTP::Tiny can do only with
; IO::Socket::SSL and Net::SSLeay; the versions are the ones HTTP::Tiny 0.096
; asks for in can_ssl().  They are recommended rather than required because
; Net::SSLeay needs OpenSSL's headers to build (it does not build on this
; machine's 32-bit perl), which would stop every other function installing;
; pdb_search says which is missing.
[Prereqs / RuntimeRecommends]
Alien::Bioinf      = 0
IO::Socket::SSL    = 1.968
Net::SSLeay        = 1.49

; done_testing() is Test::More 0.88; IO::Compress::Gzip, core since 5.9.4, makes
; t/fasta.t's .gz files without a shell, IO::Compress::Bzip2, core since
; 5.10.1, makes t/sex.t's .bz2 ones, and Storable, core since 5.7.3, copies
; t/pgs.t's frames.  t/data/make_fixtures.pl loads nothing beyond these and
; Alien::Bioinf, t/data/sex_reference.py and t/data/hirisplex_reference.py need
; cyvcf2, t/data/trait_reference.py needs only Python's own math,
; t/data/seq_reference.py needs Biopython, and t/data/emboss_reference.pl and
; t/data/faidx_reference.pl need EMBOSS and samtools on PATH; the tests run
; none of them.  Digest::SHA, core since 5.9.3, checks t/seq.t's and t/orf.t's
; longer sequences against the digests those scripts print.
[Prereqs / TestRequires]
Cwd                   = 0
Digest::SHA           = 0
File::Spec            = 0
File::Spec::Functions = 0
File::Temp            = 0
FindBin               = 0
IO::Compress::Bzip2   = 0
IO::Compress::Gzip    = 0
Storable              = 0
Sys::Hostname         = 0
Test::More            = 0.88

; t/fasta.t checks fasta2hash and hash2fasta_file for leaks when
; Test::LeakTrace is installed, and skips those three tests when it is not.
; pgs_score takes the data frames that Stats::LikeR's read_table returns, but
; never loads it; t/pgs.t also reads its fixtures with read_table when
; Stats::LikeR is installed, and skips those three tests when it is not.
[Prereqs / TestSuggests]
Stats::LikeR    = 0
Test::LeakTrace = 0

; The probe in the [MakeMaker::Awesome] header above loads Config, File::Spec
; and File::Temp before WriteMakefile runs, so a CPAN client has to have them
; to configure at all; ExtUtils::MakeMaker and File::ShareDir::Install are
; added by those plugins themselves.
[Prereqs / ConfigureRequires]
Config     = 0
File::Spec = 0
File::Temp = 0

; The repository URL follows the hhg7/<dist name> pattern of
; ~/Scripts/pdb.info/dist.ini; no repository for this distribution existed when
; it was written (2026-09-30), so check it before the first release.
[MetaResources]
repository.web  = https://github.com/hhg7/Bioinf-Basic
repository.url  = https://github.com/hhg7/Bioinf-Basic.git
repository.type = git
bugtracker.web  = https://github.com/hhg7/Bioinf-Basic/issues
homepage        = https://metacpan.org/dist/Cn-Bioinf
